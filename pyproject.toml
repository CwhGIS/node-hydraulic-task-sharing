[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "node-hydraulic-task-sharing"
version = "0.2.0"
description = "Node-level SWMM surrogate model, training, and evaluation code"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "tensorboard>=2.13",
  "torch>=2.0",
  "tqdm>=4.65",
]

[tool.setuptools.packages.find]
where = ["src"]
